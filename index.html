<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Chatbot</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #3b0764, #0f172a);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .chat-container {
            width: 95%; /* ဖုန်းစခရင်မှာ ဘေးအစွန်းအထိ နီးပါးကျယ်မည် */
            max-width: 800px; /* ကွန်ပျူတာတွင် အလွန်ကြီးမသွားစေရန် ကန့်သတ်မည် */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 85vh; /* ဖုန်းစခရင်အမြင့်၏ ၈၅ ရာခိုင်နှုန်းအထိ ယူမည် */
            max-height: 750px;
            overflow: hidden;
        }
        .chat-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-area, .email-area {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        button {
            background: #9333ea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #a855f7; }
        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e9d5ff;
            text-align: left;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .preset-btn:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1 id="ui-title" style="margin: 0; font-size: 16px;">AI Chatbot</h1>
            <select id="langSelect" style="width: auto;">
                <option value="en">English</option>
                <option value="mm">Myanmar</option>
                <option value="th">Thai</option>
            </select>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div id="presetQuestions">
                <p id="ui-preset-label" style="font-size: 11px; color: #cbd5e1; margin: 0 0 6px 0;">Suggested Questions:</p>
            </div>
        </div>

        <div class="email-area">
            <input type="email" id="userEmail" placeholder="Enter your email first...">
        </div>

        <div class="input-area chat-input-row">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button onclick="sendMessage()" id="ui-send">Send</button>
        </div>
    </div>

    <script>
        const translations = {
            en: { title: "AI Chatbot", presetLabel: "Suggested Questions:", send: "Send", placeholder: "Type a message...", emailPlaceholder: "Enter your email first...", questions: ["What is your name?", "How can I contact support?", "What are your services?"] },
            mm: { title: "AI စကားပြောစက်", presetLabel: "အကြံပြုမေးခွန်းများ:", send: "ပို့မည်", placeholder: "စာရိုက်ထည့်ပါ...", emailPlaceholder: "သင့်အီးမေးလ်ကို ဦးစွာထည့်ပါ...", questions: ["သင့်နာမည်ဘယ်သူလဲ။", "ပံ့ပိုးကူညီမှုကို ဘယ်လိုဆက်သွယ်ရမလဲ။", "ဘာဝန်ဆောင်မှုတွေ ပေးလဲ။"] },
            th: { title: "แชทบอท AI", presetLabel: "คำถามที่แนะนำ:", send: "ส่ง", placeholder: "พิมพ์ข้อความ...", emailPlaceholder: "ใส่อีเมลของคุณก่อน...", questions: ["คุณชื่ออะไร", "ฉันจะติดต่อฝ่ายสนับสนุนได้อย่างไร", "คุณให้บริการอะไรบ้าง"] }
        };

        const qaDatabase = {
            "What is your name?": "I am your AI assistant built with FastAPI and ChronoDB.",
            "သင့်နာမည်ဘယ်သူလဲ။": "ကျွန်ုပ်သည် FastAPI နှင့် ChronoDB ဖြင့် တည်ဆောက်ထားသော AI လက်ထောက် ဖြစ်ပါသည်။",
            "คุณชื่ออะไร": "ฉันคือผู้ช่วย AI ที่สร้างด้วย FastAPI และ ChronoDB",
            "How can I contact support?": "You can reach out via our email support@example.com.",
            "ပံ့ပိုးကူညီမှုကို ဘယ်လိုဆက်သွယ်ရမလဲ။": "support@example.com သို့ အီးမေးလ်ဖြင့် ဆက်သွယ်နိုင်ပါသည်။",
            "ฉันจะติดต่อฝ่ายสนับสนุนได้อย่างไร": "คุณสามารถติดต่อเราทางอีเมล support@example.com",
            "What are your services?": "We offer web development, AI automation, and database solutions.",
            "ဘာဝန်ဆောင်မှုတွေ ပေးလဲ။": "ဝဘ်ဆိုက်ရေးဆွဲခြင်း၊ AI အော်တိုမေးရှင်းနှင့် ဒေတာဘေ့စ် ဖြေရှင်းချက်များကို ပေးပါသည်။",
            "คุณให้บริการอะไรบ้าง": "เราให้บริการพัฒนาเว็บไซต์ ระบบอัตโนมัติ AI และโซลูชันฐานข้อมูล"
        };

        const langSelect = document.getElementById('langSelect');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const userEmail = document.getElementById('userEmail');

        function updateLanguage() {
            const lang = langSelect.value;
            const t = translations[lang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-preset-label').innerText = t.presetLabel;
            document.getElementById('ui-send').innerText = t.send;
            userInput.placeholder = t.placeholder;
            userEmail.placeholder = t.emailPlaceholder;

            const presetContainer = document.getElementById('presetQuestions');
            const label = document.getElementById('ui-preset-label');
            presetContainer.innerHTML = '';
            presetContainer.appendChild(label);

            t.questions.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.style.display = 'block';
                btn.style.width = '100%';
                btn.innerText = q;
                btn.onclick = () => { userInput.value = q; sendMessage(); };
                presetContainer.appendChild(btn);
            });
        }

        langSelect.onchange = updateLanguage;
        updateLanguage();

        async function sendMessage() {
            const text = userInput.value.trim();
            const email = userEmail.value.trim();
            if (!text) return;
            if (!email) { alert("Please enter your email first!"); return; }

            appendMessage(text, 'user');
            userInput.value = '';

            if (qaDatabase[text]) {
                setTimeout(() => {
                    appendMessage(qaDatabase[text], 'bot');
                    logToBackend(email, text, qaDatabase[text], 'json');
                }, 500);
            } else {
                try {
                    const response = await fetch('https://my-chatbot-backend-3y5x.onrender.com/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, message: text })
                    });
                    const data = await response.json();
                    appendMessage(data.reply, 'bot');
                } catch (error) {
                    appendMessage("Error connecting to AI backend server.", 'bot');
                }
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = sender === 'user' ? 'flex-end' : 'flex-start';
            div.style.marginBottom = '8px';
            div.innerHTML = `<div style="max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; background: ${sender === 'user' ? '#9333ea' : '#1e293b'}; color: white; border: 1px solid rgba(255,255,255,0.1);">${text}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function logToBackend(email, question, answer, source) {
            try {
                await fetch('https://my-chatbot-backend-3y5x.onrender.com/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, question, answer, source })
                });
            } catch (e) { console.error("Logging failed", e); }
        }
    </script>
</body>
</html>
