<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Lion Throne Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 5px; }
        .chat-container { width: 100%; max-width: 650px; height: 98vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: linear-gradient(135deg, #8b0000, #b8860b); color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #fcfcfc; }
        .message { max-width: 90%; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; line-height: 1.6; white-space: pre-line; word-wrap: break-word; }
        .bot-message { background-color: #f0f0f0; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-message { background-color: #8b0000; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .quick-topics { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .topic-btn { background-color: #fff; border: 1px solid #b8860b; color: #8b0000; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; text-align: left; transition: 0.2s; font-weight: 600; }
        .topic-btn:hover { background-color: #b8860b; color: #fff; }
        .detail-btn { background-color: #b8860b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; font-size: 0.85rem; display: inline-block; }
        .detail-btn:hover { background-color: #8b0000; }
        .input-area { padding: 10px; background: #fff; border-top: 1px solid #eee; display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .input-area button { background-color: #8b0000; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🏛️ Royal Lion Throne Chatbot</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message" id="welcomeMsg">
            ကျေးဇူးပြု၍ ဘာသာစကား ရွေးချယ်ပါ / Please select language / กรุณาเลือกภาษา:
            <div class="quick-topics">
                <button class="topic-btn" onclick="setLanguage('mm', 'မြန်မာ')">🇲🇲 မြန်မာ</button>
                <button class="topic-btn" onclick="setLanguage('en', 'English')">🇬🇧 English</button>
                <button class="topic-btn" onclick="setLanguage('th', 'ไทย')">🇹🇭 ไทย</button>
            </div>
        </div>
    </div>
    <div class="input-area" id="inputArea" style="display: none;">
        <input type="text" id="userInput" placeholder="မေးခွန်း ရိုက်ထည့်ပါ..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // ⚠️ ဒီနေရာမှာ Render ကရလာတဲ့ Live URL လိပ်စာကို ထည့်ပါ
    const API_URL = "https://my-chatbot-backend.onrender.com/chat";
    let selectedLang = "mm";

    function setLanguage(langCode, langName) {
        selectedLang = langCode;
        appendMessage(`ဘာသာစကား ရွေးချယ်ပြီးပါပြီ: ${langName}`, "user-message");
        setTimeout(() => {
            showMainMenu();
            document.getElementById("inputArea").style.display = "flex";
        }, 500);
    }

    function showMainMenu() {
        let menuText = selectedLang === 'mm' ? "မင်္ဂလာပါရှင်။ အောက်ပါခေါင်းစဉ်ကြီးများကို ရွေးချယ်ပါ -" :
                       selectedLang === 'en' ? "Hello! Please select a main category below:" :
                       "สวัสดีครับ/ค่ะ กรุณาเลือกหมวดหมู่หลัก:";

        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = "message bot-message";
        msgDiv.innerHTML = `${menuText}
            <div class="quick-topics">
                <button class="topic-btn" onclick="fetchTopicData('Royal Lion Throne')">🏛️ Royal Lion Throne (သီဟာသနပလ္လင်)</button>
                <button class="topic-btn" onclick="showRegaliaMenu()">👑 Other Royal Regalia and Symbols (အဆောင်အယောင် ၁-၇)</button>
                <button class="topic-btn" onclick="showPartsMenu()">🧱 Parts of the Royal Throne (ပလ္လင်အစိတ်အပိုင်း ၁-၂၁)</button>
            </div>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showRegaliaMenu() {
        appendMessage("👑 Other Royal Regalia and Symbols", "user-message");
        setTimeout(() => {
            let items = ["1. လောကနတ်", "2. ဆင်", "3. မြင်း", "4. ထီးတော်", "5. အလံ", "6. ယပ်မား", "7. သူငယ်တော် (၈) ရုပ်"];
            let html = "ကျေးဇူးပြု၍ အဆောင်အယောင် တစ်ခုကို ရွေးချယ်ပါ:<div class='quick-topics'>";
            items.forEach(item => { html += `<button class='topic-btn' onclick="fetchTopicData('${item}')">${item}</button>`; });
            html += "</div>";
            appendBotHTML(html);
        }, 300);
    }

    function showPartsMenu() {
        appendMessage("🧱 Parts of the Royal Throne", "user-message");
        setTimeout(() => {
            let items = [
                "1. မှန်တိုင်", "2. ဒုရင်ဗိမာန်", "3. ဦးဆောက်ပန်း", "4. သိကြား", "5. သမ္မာဒေဝ နတ်မင်းကြီး ၂ ပါး",
                "6. မှော်တန်း", "7. ကြာပွင့်ခံ", "8. ဥကင်တော်", "9. ကိန္နရာ", "10. ခြူးပန်း",
                "11. ဆင်နားဇာ", "12. ဒေါင်းရုပ်", "13. တံခါးတိုင်", "14. စိန်ပွင့်", "15. မာရဘင်",
                "16. ခြင်္သေ့ရုပ်", "17. မကရ်းကွက်", "18. ယုန်ရုပ်", "19. လောကနတ်", "20. စိုင်ပေါင်", "21. နဝရတ် (၉) ပါး"
            ];
            let html = "ကျေးဇူးပြု၍ ပလ္လင်အစိတ်အပိုင်း တစ်ခုကို ရွေးချယ်ပါ:<div class='quick-topics'>";
            items.forEach(item => { html += `<button class='topic-btn' onclick="fetchTopicData('${item}')">${item}</button>`; });
            html += "</div>";
            appendBotHTML(html);
        }, 300);
    }

    async function fetchTopicData(queryText) {
        appendMessage(queryText, "user-message");
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: "user@gmail.com", message: queryText, language: selectedLang })
            });

            const data = await response.json();
            if (data.type === "error" || data.reply) {
                appendMessage(data.reply || "Error occurred", "bot-message");
            } else {
                const chatBox = document.getElementById("chatBox");
                const msgDiv = document.createElement("div");
                msgDiv.className = "message bot-message";
                const uniqueId = "detail_" + Math.random().toString(36).substring(2, 9);
                
                msgDiv.innerHTML = `📌 <b>${data.title}</b><br><br>${data.summary}
                    <br><button class="detail-btn" onclick="toggleDetail('${uniqueId}')">📖 အသေးစိတ်အချက်အလက်များ (Detailed Info) ကြည့်ရန်</button>
                    <div id="${uniqueId}" style="display: none; margin-top: 10px; border-top: 1px solid #ccc; padding-top: 8px; white-space: pre-line;">${data.detailed_info}</div>`;
                
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (error) {
            appendMessage("⚠️ Server ချိတ်ဆက်၍ မရပါ။", "bot-message");
        }
    }

    function toggleDetail(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const message = inputField.value.trim();
        if (!message) return;
        inputField.value = "";
        fetchTopicData(message);
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendBotHTML(htmlContent) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = "message bot-message";
        msgDiv.innerHTML = htmlContent;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
