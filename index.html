<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Chatbot</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[600px]">
        <!-- Header -->
        <div class="p-4 bg-white/5 border-b border-white/10 flex justify-between items-center">
            <h1 class="text-white font-semibold text-lg" id="ui-title">AI Chatbot</h1>
            <!-- Language Selector -->
            <select id="langSelect" class="bg-slate-800 text-white text-sm rounded-lg px-2 py-1 border border-white/20 focus:outline-none">
                <option value="en">English</option>
                <option value="mm">Myanmar</option>
                <option value="th">Thai</option>
            </select>
        </div>

        <!-- Chat Body / Messages -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3">
            <!-- Predefined Questions Container -->
            <div id="presetQuestions" class="flex flex-col space-y-2 mb-4">
                <p class="text-xs text-slate-300 font-medium" id="ui-preset-label">Suggested Questions:</p>
                <!-- Predefined buttons will be populated via JS -->
            </div>
        </div>

        <!-- User Email Input (For DB Logging) -->
        <div class="px-4 py-2 bg-white/5 border-t border-white/10">
            <input type="email" id="userEmail" placeholder="Enter your email first..." class="w-full bg-slate-800/80 text-white text-sm px-3 py-2 rounded-lg border border-white/20 focus:outline-none focus:border-purple-400">
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white/5 border-t border-white/10 flex gap-2">
            <input type="text" id="userInput" placeholder="Type a message..." class="flex-1 bg-slate-800/80 text-white text-sm px-3 py-2 rounded-lg border border-white/20 focus:outline-none focus:border-purple-400">
            <button onclick="sendMessage()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition" id="ui-send">Send</button>
        </div>
    </div>

    <script>
        // Translations and Predefined Questions Data
        const translations = {
            en: {
                title: "AI Chatbot",
                presetLabel: "Suggested Questions:",
                send: "Send",
                placeholder: "Type a message...",
                emailPlaceholder: "Enter your email first...",
                questions: ["What is your name?", "How can I contact support?", "What are your services?"]
            },
            mm: {
                title: "AI စကားပြောစက်",
                presetLabel: "မေးခွန်း לדוגမာများ (Suggested):",
                send: "ပို့မည်",
                placeholder: "စာရိုက်ထည့်ပါ...",
                emailPlaceholder: "သင့်အီးမေးလ်ကို ဦးစွာထည့်ပါ...",
                questions: ["သင့်နာမည်ဘယ်သူလဲ။", "ပံ့ပိုးကူညီမှုကို ဘယ်လိုဆက်သွယ်ရမလဲ။", "ဘာဝန်ဆောင်မှုတွေ ပေးလဲ။"]
            },
            th: {
                title: "แชทบอท AI",
                presetLabel: "คำถามที่แนะนำ:",
                send: "ส่ง",
                placeholder: "พิมพ์ข้อความ...",
                emailPlaceholder: "ใส่อีเมลของคุณก่อน...",
                questions: ["คุณชื่ออะไร", "ฉันจะติดต่อฝ่ายสนับสนุนได้อย่างไร", "คุณให้บริการอะไรบ้าง"]
            }
        };

        const qaDatabase = {
            "What is your name?": "I am your AI assistant built with FastAPI and ChronoDB.",
            "သင့်နာမည်ဘယ်သူလဲ။": "ကျွန်ုပ်သည် FastAPI နှင့် ChronoDB ဖြင့် တည်ဆောက်ထားသော AI လက်ထောက် ဖြစ်ပါသည်။",
            "คุณชื่ออะไร": "ฉันคือผู้ช่วย AI ที่สร้างด้วย FastAPI และ ChronoDB",
            "How can I contact support?": "You can reach out via our email support@example.com.",
            "ပံ့ပိုးကူညီမှုကို ဘယ်လိုဆက်သွယ်ရမလဲ။": "support@example.com သို့ အီးမေးလ်ဖြင့် ဆက်သွယ်နိုင်ပါသည်။",
            "ฉันจะติดต่อฝ่ายสนับสนุนได้อย่างไร": "คุณสามารถติดต่อเราทางอีเมล support@example.com",
            "What are your services?": "We offer web development, AI automation, and database solutions.",
            "ဘာဝန်ဆောင်မှုတွေ ပေးလဲ။": "ဝဘ်ဆိုက်ရေးဆွဲခြင်း၊ AI အော်တိုမေးရှင်းနှင့် ဒေတာဘေ့စ် ဖြေရှင်းချက်များကို ပေးပါသည်။",
            "คุณให้บริการอะไรบ้าง": "เราให้บริการพัฒนาเว็บไซต์ ระบบอัตโนมัติ AI และโซลูชันฐานข้อมูล"
        };

        const langSelect = document.getElementById('langSelect');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const userEmail = document.getElementById('userEmail');

        function updateLanguage() {
            const lang = langSelect.value;
            const t = translations[lang];
            
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-preset-label').innerText = t.presetLabel;
            document.getElementById('ui-send').innerText = t.send;
            userInput.placeholder = t.placeholder;
            userEmail.placeholder = t.emailPlaceholder;

            // Update Preset Buttons
            const presetContainer = document.getElementById('presetQuestions');
            // Keep label, remove old buttons
            const label = document.getElementById('ui-preset-label');
            presetContainer.innerHTML = '';
            presetContainer.appendChild(label);

            t.questions.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'text-left bg-white/5 hover:bg-white/10 text-purple-200 text-xs px-3 py-2 rounded-lg border border-white/10 transition';
                btn.innerText = q;
                btn.onclick = () => { userInput.value = q; sendMessage(); };
                presetContainer.appendChild(btn);
            });
        }

        langSelect.onchange = updateLanguage;
        updateLanguage(); // Initial load

        async function sendMessage() {
            const text = userInput.value.trim();
            const email = userEmail.value.trim();
            if (!text) return;

            if (!email) {
                alert("Please enter your email first!");
                return;
            }

            // Append User Message
            appendMessage(text, 'user');
            userInput.value = '';

            // 1. Check local JSON / Predefined QA first
            if (qaDatabase[text]) {
                setTimeout(() => {
                    appendMessage(qaDatabase[text], 'bot');
                    logToBackend(email, text, qaDatabase[text], 'json');
                }, 500);
            } else {
                // 2. If not in JSON, query FastAPI Backend (AI / ChronoDB)
                try {
                    const response = await fetch('https://my-chatbot-backend-3y5x.onrender.com/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, message: text })
                    });
                    const data = await response.json();
                    appendMessage(data.reply, 'bot');
                } catch (error) {
                    appendMessage("Error connecting to AI backend server.", 'bot');
                }
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[80%] px-3 py-2 rounded-xl text-sm ${sender === 'user' ? 'bg-purple-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none border border-white/10'}">${text}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function logToBackend(email, question, answer, source) {
            try {
                await fetch('https://your-backend-url.onrender.com/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, question, answer, source })
                });
            } catch (e) {
                console.error("Logging failed", e);
            }
        }
    </script>
</body>
</html>
